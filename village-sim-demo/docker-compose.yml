version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - USE_LLM=true
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1
      - TICK_MS=3000
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
