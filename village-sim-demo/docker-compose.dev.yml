version: "3.8"

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      # Mount entire project for hot reload
      - .:/app
      # Persist node_modules in volume (don't overwrite from host)
      - /app/node_modules
      # Database persistence
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - PORT=3000
      - USE_LLM=true
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1
      - TICK_MS=3000
      - DB_PATH=/app/data/village-sim.db
    depends_on:
      - ollama
    command: npm run dev

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
