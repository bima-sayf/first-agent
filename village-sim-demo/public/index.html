<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Village of Nine — Live Demo</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <header>
    <h1>🏡 Village of Nine</h1>
    <div id="engine-badge" class="badge">connecting…</div>
    <div id="clock">--:--</div>
  </header>

  <main>
    <div id="game-container"></div>

    <aside id="panel">
      <section>
        <h2>Villagers</h2>
        <div id="villager-list"></div>
      </section>
      <section>
        <h2>Village Log</h2>
        <div id="log"></div>
      </section>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
