# ---------------------------------------------------------------------
# LOCAL MODIFICATION (Kiro): this is Spark 3.5.3's own default
# org/apache/spark/log4j2-defaults.properties (pulled from spark-core's jar),
# with ONE addition at the bottom: silencing HiveExternalCatalog's benign
# "Could not alter schema of table ... in a Hive compatible way" WARN.
#
# Root cause of that WARN: Delta isn't a Hive-native table format. Every
# saveAsTable onto an existing Delta table makes Spark's HiveExternalCatalog
# try a Hive-compatible ALTER TABLE first (HiveExternalCatalog.scala's
# alterTableDataSchema), which Hive's metastore always rejects for a
# non-Hive-SerDe table, then falls back to storing the schema in table
# properties instead - which IS the correct, working path for Delta. There is
# no Spark or Delta config flag that skips the doomed-to-fail attempt; it is
# unconditional in HiveExternalCatalog, so the only lever available is the
# log level of that one logger. Silencing it changes nothing about behavior -
# every write still fully succeeds - it only removes a WARN Spark logs about
# its own internal fallback attempt.
# ---------------------------------------------------------------------

# Set everything to be logged to the console
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Settings to quiet third party logs that are too verbose
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error
logger.repl1.name = org.apache.spark.repl.SparkIMain$exprTyper
logger.repl1.level = info
logger.repl2.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
logger.repl2.level = info

# Set the default spark-shell log level to WARN. When running the spark-shell, the
# log level for this class is used to overwrite the root logger's log level, so that
# the user can have different defaults for the shell and regular Spark apps.
logger.repl.name = org.apache.spark.repl.Main
logger.repl.level = warn

# SPARK-9183: Settings to avoid annoying messages when looking up nonexistent UDFs
# in SparkSQL with Hive support
logger.metastore.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.metastore.level = fatal
logger.hive_functionregistry.name = org.apache.hadoop.hive.ql.exec.FunctionRegistry
logger.hive_functionregistry.level = error

# Parquet related logging
logger.parquet.name = org.apache.parquet.CorruptStatistics
logger.parquet.level = error
logger.parquet2.name = parquet.CorruptStatistics
logger.parquet2.level = error

# ---- Kiro addition: silence the benign Delta-vs-Hive schema ALTER fallback.
# This is the ONLY line added beyond Spark's own defaults above. It does not
# affect delta.hooks.UpdateCatalog (a different, async post-commit hook) or
# any other Delta/Hive logging - only the specific class that logs this one
# WARN. Set to 'warn' instead of 'error' if you want to see it again while
# debugging an actual catalog-sync problem.
logger.hive_ext_catalog.name = org.apache.spark.sql.hive.HiveExternalCatalog
logger.hive_ext_catalog.level = error
