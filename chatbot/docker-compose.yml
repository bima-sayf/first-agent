services:
  ollama:
    image: ollama/ollama:latest
    container_name: hermes-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "hermes3"]

  bot:
    build: .
    container_name: hermes-telegram-bot
    depends_on:
      model-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/chat
    volumes:
      - ./session:/app/session
    stdin_open: true
    tty: true

volumes:
  ollama_data:
